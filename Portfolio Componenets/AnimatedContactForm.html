<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form with Particle Background</title>

<style>
:root {
  --bg: #050509;
  --panel: #12121a;
  --accent: #7c7cff;
  --accent-light: rgba(124,124,255,0.2);
  --text: #ffffff;
  --muted: rgba(255,255,255,0.65);
}

* { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, -apple-system, sans-serif; }

body { background: var(--bg); color: var(--text); overflow-x: hidden; }

/* =========================
   PARTICLE CANVAS
========================= */
.particle-bg {
  position: absolute;
  inset:0;
  z-index: 0;
  pointer-events: none;
}

/* =========================
   CONTACT SECTION
========================= */
.contact-section {
  position: relative;
  padding: clamp(80px, 12vw, 140px) 20px;
  z-index: 1;
}

.contact-section h2 {
  text-align: center;
  font-size: clamp(2.4rem, 5vw, 3rem);
  margin-bottom: 20px;
}

.contact-section p {
  text-align: center;
  margin-bottom: 60px;
  opacity: 0.75;
}

/* =========================
   FORM
========================= */
.contact-form {
  position: relative;
  max-width: 600px;
  margin: 0 auto;
  display: grid;
  gap: 24px;
  background: var(--panel);
  padding: 40px;
  border-radius: 24px;
  box-shadow: 0 30px 70px rgba(0,0,0,0.6);
  z-index: 1;
}

.contact-form .input-group {
  position: relative;
}

.contact-form input,
.contact-form textarea {
  width: 100%;
  background: transparent;
  border: 2px solid var(--muted);
  border-radius: 12px;
  padding: 18px 16px 6px 16px;
  font-size: 1rem;
  color: var(--text);
  outline: none;
  transition: all 0.3s ease;
  resize: none;
}

.contact-form input:focus,
.contact-form textarea:focus {
  border-color: var(--accent);
}

.contact-form label {
  position: absolute;
  top: 18px;
  left: 16px;
  color: var(--muted);
  font-size: 1rem;
  pointer-events: none;
  transition: all 0.3s ease;
}

.contact-form input:focus + label,
.contact-form input:not(:placeholder-shown) + label,
.contact-form textarea:focus + label,
.contact-form textarea:not(:placeholder-shown) + label {
  top: 6px;
  font-size: 0.8rem;
  color: var(--accent);
}

.contact-form button {
  background: var(--accent);
  color: #000;
  font-weight: 700;
  padding: 16px 0;
  border: none;
  border-radius: 14px;
  font-size: 1.1rem;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
}

.contact-form button::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 0;
  top: 0;
  left: 0;
  background: rgba(255,255,255,0.1);
  transition: all 0.3s ease;
}

.contact-form button:hover::after {
  height: 100%;
}

.contact-form button:active {
  transform: scale(0.97);
}

.success-msg {
  display: none;
  text-align: center;
  margin-top: 20px;
  font-weight: 600;
  color: var(--accent);
  opacity: 0;
  transition: all 0.5s ease;
}

.success-msg.show {
  display: block;
  opacity: 1;
}

@media (max-width:600px){
  .contact-form { padding:30px 20px; }
}
</style>
</head>

<body>

<section class="contact-section" id="contact">
  <canvas class="particle-bg" id="particleCanvas"></canvas>
  <h2>Contact Me</h2>
  <p>Have a question or want to work together? Send me a message!</p>

  <form class="contact-form" id="contactForm">
    <div class="input-group">
      <input type="text" id="name" name="name" required placeholder=" " />
      <label for="name">Your Name</label>
    </div>

    <div class="input-group">
      <input type="email" id="email" name="email" required placeholder=" " />
      <label for="email">Your Email</label>
    </div>

    <div class="input-group">
      <textarea id="message" name="message" rows="5" required placeholder=" "></textarea>
      <label for="message">Your Message</label>
    </div>

    <button type="submit">Send Message</button>
    <div class="success-msg" id="successMsg">Message Sent Successfully! ✅</div>
  </form>
</section>

<script>
/* =========================
   CONTACT FORM ANIMATION
========================= */
const form = document.getElementById("contactForm");
const successMsg = document.getElementById("successMsg");

form.addEventListener("submit", (e) => {
  e.preventDefault();
  successMsg.classList.remove("show");
  setTimeout(() => {
    successMsg.classList.add("show");
    form.reset();
  }, 300);
});

/* =========================
   PARTICLE BACKGROUND
========================= */
const canvas = document.getElementById("particleCanvas");
const ctx = canvas.getContext("2d");
let particles = [];
const particleCount = 80;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 3 + 1;
    this.speedX = (Math.random() - 0.5) * 0.5;
    this.speedY = (Math.random() - 0.5) * 0.5;
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
      this.reset();
    }
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fillStyle = "rgba(124,124,255,0.4)";
    ctx.fill();
  }
}

for (let i=0;i<particleCount;i++){
  particles.push(new Particle());
}

function animate() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p => {
    p.update();
    p.draw();
  });

  // Draw lines
  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){
      let dx = particles[i].x - particles[j].x;
      let dy = particles[i].y - particles[j].y;
      let dist = Math.sqrt(dx*dx + dy*dy);
      if(dist < 120){
        ctx.beginPath();
        ctx.strokeStyle = "rgba(124,124,255,0.1)";
        ctx.lineWidth = 1;
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
