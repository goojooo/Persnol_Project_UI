<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Portfolio Spotlight Grid</title>

<style>
:root {
  --bg: #0b0b0f;
  --card: #12121a;
  --accent: #7c7cff;
  --text: #ffffff;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: radial-gradient(circle at top, #151520, #000);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
}

.container {
  width: 90%;
  max-width: 1100px;
}

h1 {
  text-align: center;
  margin-bottom: 40px;
  font-size: 2.5rem;
  letter-spacing: 1px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 25px;
}

.card {
  position: relative;
  background: var(--card);
  border-radius: 16px;
  padding: 30px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.3s ease;
}

.card:hover {
  transform: translateY(-8px);
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(
    600px circle at var(--x) var(--y),
    rgba(124,124,255,0.25),
    transparent 40%
  );
  opacity: 0;
  transition: opacity 0.3s;
}

.card:hover::before {
  opacity: 1;
}

.card h2 {
  margin-bottom: 10px;
}

.card p {
  opacity: 0.8;
  line-height: 1.5;
}

.tag {
  display: inline-block;
  margin-top: 15px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  background: rgba(255,255,255,0.1);
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

.modal.active {
  display: flex;
}

.modal-content {
  background: #14141f;
  width: 90%;
  max-width: 500px;
  border-radius: 20px;
  padding: 30px;
  animation: scaleIn 0.4s ease;
}

@keyframes scaleIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.modal h2 {
  margin-bottom: 15px;
}

.modal p {
  opacity: 0.9;
  line-height: 1.6;
}

.close {
  margin-top: 25px;
  padding: 10px 20px;
  border-radius: 30px;
  border: none;
  background: var(--accent);
  color: #000;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <h1>🚀 Featured Projects</h1>

  <div class="grid">
    <div class="card" data-title="Creative Portfolio" data-desc="A modern animated portfolio website built using HTML, CSS and JavaScript. Focused on UI/UX and performance.">
      <h2>Creative Portfolio</h2>
      <p>Animated personal website</p>
      <span class="tag">Frontend</span>
    </div>

    <div class="card" data-title="E-Commerce UI" data-desc="A clean e-commerce interface with smooth transitions, product cards and responsive layouts.">
      <h2>E-Commerce UI</h2>
      <p>Shopping platform design</p>
      <span class="tag">UI Design</span>
    </div>

    <div class="card" data-title="Dashboard App" data-desc="A dark-mode analytics dashboard with interactive charts and cards.">
      <h2>Dashboard App</h2>
      <p>Admin analytics panel</p>
      <span class="tag">Web App</span>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle"></h2>
    <p id="modalDesc"></p>
    <button class="close">Close</button>
  </div>
</div>

<script>
const cards = document.querySelectorAll(".card");
const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const modalDesc = document.getElementById("modalDesc");
const closeBtn = document.querySelector(".close");

/* Spotlight effect */
cards.forEach(card => {
  card.addEventListener("mousemove", e => {
    const rect = card.getBoundingClientRect();
    card.style.setProperty("--x", `${e.clientX - rect.left}px`);
    card.style.setProperty("--y", `${e.clientY - rect.top}px`);
  });

  card.addEventListener("click", () => {
    modalTitle.textContent = card.dataset.title;
    modalDesc.textContent = card.dataset.desc;
    modal.classList.add("active");
  });
});

closeBtn.addEventListener("click", () => {
  modal.classList.remove("active");
});

modal.addEventListener("click", e => {
  if (e.target === modal) modal.classList.remove("active");
});
</script>

</body>
</html>
