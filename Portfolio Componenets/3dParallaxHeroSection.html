<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive 3D Parallax Hero</title>

<style>
:root {
  --accent: #7c7cff;
  --accent2: #00ffd5;
  --bg: #050509;
  --glass: rgba(255,255,255,0.08);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  background: var(--bg);
  color: white;
  overflow-x: hidden;
}

/* =========================
   CANVAS BACKGROUND
========================= */
canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* =========================
   HERO LAYOUT
========================= */
.hero {
  position: relative;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: clamp(24px, 6vw, 80px);
  perspective: 1000px;
}

.hero-inner {
  position: relative;
  width: 100%;
  max-width: 1100px;
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  align-items: center;
  gap: clamp(40px, 6vw, 80px);
  transform-style: preserve-3d;
  z-index: 2;
}

/* =========================
   TEXT CONTENT
========================= */
.hero-text h1 {
  font-size: clamp(2.4rem, 5vw, 4rem);
  line-height: 1.1;
}

.hero-text span {
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  color: transparent;
}

.hero-text p {
  margin-top: 24px;
  max-width: 520px;
  line-height: 1.6;
  opacity: 0.85;
  font-size: clamp(1rem, 1.5vw, 1.1rem);
}

.cta {
  margin-top: 36px;
  display: inline-block;
  padding: 14px 36px;
  border-radius: 40px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  color: #000;
  font-weight: 600;
}

/* =========================
   VISUAL CARDS
========================= */
.hero-visual {
  position: relative;
  height: 360px;
  transform-style: preserve-3d;
}

.card {
  position: absolute;
  width: 220px;
  height: 140px;
  background: var(--glass);
  backdrop-filter: blur(16px);
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.card.one {
  top: 0;
  left: 0;
  transform: translateZ(60px);
}

.card.two {
  bottom: 0;
  right: 0;
  transform: translateZ(120px);
}

/* =========================
   RESPONSIVE FIXES
========================= */
@media (max-width: 900px) {
  .hero-inner {
    grid-template-columns: 1fr;
    text-align: center;
  }

  .hero-text p {
    margin-inline: auto;
  }

  .hero-visual {
    height: 280px;
  }

  .card {
    position: relative;
    margin: 0 auto 20px;
    transform: none !important;
  }
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<section class="hero">
  <div class="hero-inner" id="parallax">

    <div class="hero-text">
      <h1>
        Pixel-Perfect <span>3D</span><br>
        Web Experiences
      </h1>
      <p>
        I design immersive, high-performance interfaces that scale beautifully
        across all devices.
      </p>
      <div class="cta">View Projects</div>
    </div>

    <div class="hero-visual">
      <div class="card one">
        ⚡ Fast<br><small>Optimized performance</small>
      </div>
      <div class="card two">
        🎨 Creative<br><small>Design-driven UI</small>
      </div>
    </div>

  </div>
</section>

<script>
/* =========================
   CANVAS PARTICLES (RESPONSIVE)
========================= */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
let particles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function createParticles() {
  particles = Array.from({ length: 70 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2 + 0.5,
    dx: (Math.random() - 0.5) * 0.3,
    dy: (Math.random() - 0.5) * 0.3
  }));
}
createParticles();

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  particles.forEach(p => {
    p.x += p.dx;
    p.y += p.dy;

    if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.dy *= -1;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(124,124,255,0.6)";
    ctx.fill();
  });

  requestAnimationFrame(animate);
}
animate();

/* =========================
   PARALLAX (DESKTOP ONLY)
========================= */
const parallax = document.getElementById("parallax");

if (window.innerWidth > 900) {
  document.addEventListener("mousemove", e => {
    const x = (window.innerWidth / 2 - e.clientX) / 60;
    const y = (window.innerHeight / 2 - e.clientY) / 60;

    parallax.style.transform = `
      rotateY(${x}deg)
      rotateX(${-y}deg)
    `;
  });
}
</script>

</body>
</html>
